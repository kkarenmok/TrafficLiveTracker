databases:
  - name: traffic-live-tracker-db
    plan: free
    databaseName: traffic_live_tracker
    user: traffic_live_tracker
    ipAllowList: []

services:
  - type: web
    name: traffic-live-tracker-api
    runtime: python
    plan: free
    buildCommand: pip install -e .
    startCommand: alembic upgrade head && uvicorn traffic_live_tracker.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: DATABASE_URL
        fromDatabase:
          name: traffic-live-tracker-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://kkarenmok.github.io
      - key: TFL_APP_KEY
        sync: false
      - key: REFRESH_SECONDS
        value: 30
